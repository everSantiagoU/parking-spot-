spring:
  application:
    name: parking-spot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkingspot}
    username: ${DB_USERNAME:parkingspot}
    password: ${DB_PASSWORD:}
  flyway:
    # Migraciones versionadas en src/main/resources/db/migration (HU-05).
    # Se aplican solas al arrancar el backend.
    enabled: true
    locations: classpath:db/migration
  jpa:
    # El esquema lo crean las migraciones de Flyway, nunca Hibernate.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${TZ:America/Bogota}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Muestra el estado de cada componente (por ejemplo, "db") sin datos sensibles.
      show-components: always
springdoc:
  show-actuator: true
